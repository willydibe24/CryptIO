# Reference nginx config for CryptIO, reverse-proxied over HTTPS on 3000.
#
# This file is not applied automatically. To use it:
#   1. Copy it to /etc/nginx/sites-available/cryptio.conf on the host.
#   2. Symlink it: ln -s /etc/nginx/sites-available/cryptio.conf /etc/nginx/sites-enabled/
#   3. Test and reload: nginx -t && systemctl reload nginx
#
# The CryptIO container is only published on 127.0.0.1:3000 (see
# docker-compose.yml) — nginx is the only thing exposed publicly, also on
# port 3000, terminating TLS with a self-signed cert.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    return 301 https://$host:3000$request_uri;
}

server {
    listen 3000 ssl;
    listen [::]:3000 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/ssl/server.crt;
    ssl_certificate_key /etc/ssl/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # CryptIO encrypts/decrypts arbitrary user files client-side; the
    # browser still has to upload/download the whole file through this
    # proxy, so raise the defaults well above nginx's 1M/60s limits.
    client_max_body_size 0;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
